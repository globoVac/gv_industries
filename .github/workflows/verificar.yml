name: Verificar codigo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: false
      - name: Conferir sintaxe PHP
        run: git ls-files -z '*.php' | xargs -0 -r -n1 php -l
      - name: Conferir isolamento das configuracoes
        run: php -n tests/configuracao.php
      - name: Conferir ferramenta de ligacao sem rede
        run: php tests/conexao-webtuga.php
      - name: Conferir comparacao de ficheiros sem rede
        run: php tests/conferencia-webtuga.php
