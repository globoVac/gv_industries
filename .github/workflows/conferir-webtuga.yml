name: Conferir ficheiros WebTuga

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webtuga-gv-industries
  cancel-in-progress: false

jobs:
  conferir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: false
      - name: Validar a conferencia sem rede
        run: php tests/conferencia-webtuga.php
      - name: Comparar sem publicar
        env:
          WEBTUGA_FTP_HOST: ${{ vars.WEBTUGA_FTP_HOST }}
          WEBTUGA_FTP_USERNAME: ${{ secrets.WEBTUGA_FTP_USERNAME }}
          WEBTUGA_FTP_PASSWORD: ${{ secrets.WEBTUGA_FTP_PASSWORD }}
        run: php scripts/conferir-webtuga.php
